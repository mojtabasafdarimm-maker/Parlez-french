<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>⚡ AI Studio Hub</title>
  <meta name="theme-color" content="#090d16">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="AI Hub">
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 24px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #090d16;
      color: #f1f5f9;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
    }
    .launcher-card {
      background: #111827;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 24px;
      padding: 36px 28px;
      max-width: 380px;
      width: 100%;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
    }
    .brand-icon {
      width: 64px;
      height: 64px;
      border-radius: 18px;
      background: linear-gradient(135deg, #38bdf8, #818cf8);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      margin-bottom: 20px;
      box-shadow: 0 8px 24px rgba(56, 189, 248, 0.3);
    }
    h1 {
      margin: 0 0 8px 0;
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.5px;
    }
    p {
      color: #94a3b8;
      font-size: 14px;
      line-height: 1.5;
      margin: 0 0 24px 0;
    }
    .spinner {
      width: 32px;
      height: 32px;
      border: 3px solid rgba(255, 255, 255, 0.12);
      border-top-color: #38bdf8;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 16px auto;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .status-text {
      font-size: 13px;
      color: #38bdf8;
      font-weight: 500;
    }
    .retry-btn {
      display: none;
      margin-top: 16px;
      padding: 10px 20px;
      background: #2563eb;
      color: white;
      border: none;
      border-radius: 10px;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="launcher-card">
    <div class="brand-icon">⚡</div>
    <h1>AI Studio Hub</h1>
    <div id="spinner" class="spinner"></div>
    <div id="statusText" class="status-text">Connecting to your PC…</div>
    <p id="descText" style="margin-top:14px;">Routing you to your live agent workspace.</p>
    <button id="retryBtn" class="retry-btn" onclick="connect()">Retry Connection</button>
  </div>

  <script>
    async function connect() {
      const statusEl = document.getElementById('statusText');
      const descEl = document.getElementById('descText');
      const spinnerEl = document.getElementById('spinner');
      const retryBtn = document.getElementById('retryBtn');

      statusEl.textContent = 'Locating active tunnel…';
      spinnerEl.style.display = 'block';
      retryBtn.style.display = 'none';

      try {
        const res = await fetch('https://raw.githubusercontent.com/mojtabasafdarimm-maker/AI-Studio-Hub/main/public/active-tunnel.json?_t=' + Date.now());
        if (!res.ok) throw new Error('Could not fetch active tunnel descriptor');
        const data = await res.json();
        if (data && data.url) {
          statusEl.textContent = 'Connecting…';
          window.location.replace(data.url);
          return;
        }
        throw new Error('No active tunnel URL recorded yet');
      } catch (err) {
        spinnerEl.style.display = 'none';
        statusEl.textContent = 'PC Offline';
        statusEl.style.color = '#f59e0b';
        descEl.textContent = 'Your computer is either asleep or AI Studio Hub has not started yet. Make sure your PC is powered on.';
        retryBtn.style.display = 'inline-block';
        setTimeout(connect, 5000);
      }
    }
    connect();
  </script>
</body>
</html>
